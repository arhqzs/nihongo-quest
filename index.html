<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Nunito:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;800&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Kaisei+Tokumin:wght@700;800&family=Noto+Serif+JP:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <header class="top">
    <div class="top-inner">
      <div class="logo">
        <svg class="torii" viewBox="0 0 26 22" aria-hidden="true">
          <rect x="1" y="2" width="24" height="3" rx="1.5" fill="var(--red)"></rect>
          <rect x="4" y="8" width="18" height="2.4" rx="1.2" fill="var(--red)"></rect>
          <rect x="6" y="4" width="3" height="18" rx="1.2" fill="var(--red)"></rect>
          <rect x="17" y="4" width="3" height="18" rx="1.2" fill="var(--red)"></rect>
        </svg>
        <span>Nihongo Quest</span>
      </div>
      <div class="statchips" id="statchips" aria-live="polite"></div>
    </div>
  </header>

  <main>
    <section id="view-learn" hidden></section>
    <section id="view-practice" hidden></section>
    <section id="view-sensei" hidden></section>
    <section id="view-me" hidden></section>
  </main>

  <nav class="tabs" aria-label="Main">
    <div class="tabs-inner" id="tabbar"></div>
  </nav>
</div>

<div id="lesson" hidden></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
